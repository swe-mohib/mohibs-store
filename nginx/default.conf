# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name store.mohibs.in cms.store.mohibs.in;
    return 301 https://$host$request_uri;
}

# Storefront
server {
    listen 443 ssl;
    server_name store.mohibs.in;

    ssl_certificate /etc/letsencrypt/live/store.mohibs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.mohibs.in/privkey.pem;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Admin CMS / API
server {
    listen 443 ssl;
    server_name cms.store.mohibs.in;

    ssl_certificate /etc/letsencrypt/live/store.mohibs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.mohibs.in/privkey.pem;

    location / {
        proxy_pass http://backend-cms-admin:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
